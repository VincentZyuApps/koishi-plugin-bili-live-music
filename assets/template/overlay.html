<!doctype html>
<html lang="zh-CN" data-overlay-version="11">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bili-live-music</title>
  <style>
    @font-face {
      font-family: "BiliLiveMusicLXGW";
      src: url(__FONT_URL__) format("truetype");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      font-family: "BiliLiveMusicLXGW", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; letter-spacing: 0; }

    .shell {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      color: #f8fafc;
      background: rgba(22, 24, 29, .92);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .24);
    }

    .cover-wrap { position: relative; overflow: hidden; background: #30343b; }
    .cover { width: 100%; height: 100%; display: block; object-fit: cover; }
    .cover-fallback { width: 100%; height: 100%; display: grid; place-items: center; color: #aeb5c0; font-size: 36px; }
    .loading-mask { position: absolute; z-index: 2; inset: 0; display: grid; place-content: center; justify-items: center; gap: 9px; color: #fff; background: rgba(20, 23, 29, .58); animation: loading-reveal .2s ease .3s both; }
    .loading-mask[hidden] { display: none; }
    .loading-spinner { width: 28px; height: 28px; box-sizing: border-box; border: 3px solid rgba(255, 255, 255, .3); border-top-color: #ff8eb4; border-radius: 50%; animation: loading-spin .8s linear infinite; }
    .loading-label { font-size: 12px; font-weight: 700; }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @keyframes loading-reveal { from { opacity: 0; } to { opacity: 1; } }
    .content { min-width: 0; }
    .eyebrow { color: #f08aaa; font-size: 12px; font-weight: 700; }
    .title { margin-top: 3px; overflow: hidden; font-size: 21px; font-weight: 700; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .title.empty { color: #c4cad3; }
    .artist { margin-top: 5px; overflow: hidden; color: #d7dce3; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .meta { margin-top: 5px; overflow: hidden; color: #9fa7b2; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }

    .progress-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .progress-track { height: 4px; flex: 1; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, .14); }
    .progress-value { width: 0; height: 100%; background: #ef6f9a; transition: width .25s linear; }
    .time { min-width: 70px; color: #aeb5bf; font-size: 11px; text-align: right; }

    .queue-block { min-width: 0; }
    .queue-heading { display: flex; justify-content: space-between; color: #b8bec8; font-size: 12px; }
    .queue-list { margin-top: 7px; border-top: 1px solid rgba(255, 255, 255, .1); }
    .queue-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 7px 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
    .queue-index { color: #ef8dac; font-size: 11px; }
    .queue-song { overflow: hidden; color: #e4e7ec; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .queue-empty { padding-top: 8px; color: #858e9a; font-size: 12px; }

    .device {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 3px 7px;
      border-radius: 5px;
      color: #cbd1da;
      background: rgba(7, 9, 12, .68);
      font-size: 10px;
      opacity: .5;
    }
    .role-dot { width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: #8d96a2; }
    body[data-role="player"] .role-dot, body[data-role="vlc"] .role-dot { background: #49c98b; }
    .claim { min-height: 22px; padding: 2px 7px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 4px; color: #fff; background: #343942; cursor: pointer; font: inherit; }
    .claim[hidden] { display: none; }

    .controls {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 8px;
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 6px;
      background: rgba(7, 9, 12, .82);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity .15s ease;
    }
    body[data-role="player"]:hover .controls, body[data-role="vlc"]:hover .controls, .controls:focus-within { opacity: 1; pointer-events: auto; }
    .control-button { width: 32px; height: 30px; padding: 0; border: 1px solid rgba(255, 255, 255, .18); border-radius: 5px; color: #f8fafc; background: #292d34; cursor: pointer; font: inherit; }
    .control-button:hover:not(:disabled) { border-color: #ef8dac; color: #ffb3ca; }
    .control-button:disabled { cursor: not-allowed; opacity: .35; }
    .control-button.primary { background: #c83f70; border-color: #db5c89; }

    .finished-mask {
      position: absolute;
      z-index: 4;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 5px;
      color: #fff;
      background: rgba(7, 9, 12, .64);
      text-align: center;
      pointer-events: none;
    }
    .finished-mask[hidden] { display: none; }
    .finished-title { color: #ffb3ca; font-size: 21px; font-weight: 700; }
    .finished-detail { color: rgba(255, 255, 255, .82); font-size: 13px; }
    .finished-mask.skipped .finished-title { color: #f5ce7a; }
    .finished-mask.error { background: rgba(75, 12, 21, .7); }
    .finished-mask.error .finished-title { color: #ffd7dc; }

    body[data-layout="mini"] .shell { display: grid; width: 520px; height: 104px; grid-template-columns: 82px minmax(0, 1fr); padding: 9px; gap: 11px; }
    body[data-layout="mini"] .cover-wrap { border-radius: 5px; aspect-ratio: 1; height: 100%; max-height: 82px; align-self: center; }
    body[data-layout="mini"] .content { align-self: center; padding-right: 6px; }
    body[data-layout="mini"] .eyebrow { display: none; }
    body[data-layout="mini"] .title { margin-top: 0; font-size: 18px; }
    body[data-layout="mini"] .artist { margin-top: 3px; font-size: 12px; }
    body[data-layout="mini"] .meta { display: none; }
    body[data-layout="mini"] .progress-row { margin-top: 7px; }
    body[data-layout="mini"] .queue-block { display: none; }
    body[data-layout="mini"] .device { top: 5px; right: 5px; }
    body[data-layout="mini"] .finished-title { font-size: 17px; }
    body[data-layout="mini"] .finished-detail { font-size: 11px; }

    body[data-layout="standard"] .shell { display: grid; width: 640px; height: 240px; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: 1fr; gap: 18px; padding: 16px; }
    body[data-layout="standard"] .cover-wrap { align-self: stretch; border-radius: 6px; aspect-ratio: 1; max-height: 100%; }
    body[data-layout="standard"] .content { display: flex; min-height: 0; flex-direction: column; justify-content: center; padding-right: 4px; }
    body[data-layout="standard"] .queue-block { margin-top: 12px; }
    body[data-layout="standard"] .queue-item:nth-child(n+3) { display: none; }

    body[data-layout="sidebar"] .shell { display: flex; width: 300px; height: 666.666666px; flex-direction: column; padding: 14px; }
    body[data-layout="sidebar"] .cover-wrap { width: min(100%, 252px); margin: 0 auto; border-radius: 6px; aspect-ratio: 1; flex: 0 0 auto; }
    body[data-layout="sidebar"] .content { margin-top: 14px; }
    body[data-layout="sidebar"] .title { font-size: 22px; }
    body[data-layout="sidebar"] .queue-block { min-height: 0; margin-top: 18px; overflow: hidden; }
    body[data-layout="sidebar"] .queue-item:nth-child(n+6) { display: none; }

    @media (max-width: 360px) {
      .title { font-size: 17px; }
      .device { max-width: 150px; }
      .role-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="cover-wrap">
      <img id="cover" class="cover" alt="" hidden>
      <div id="cover-fallback" class="cover-fallback" aria-hidden="true">♫</div>
      <div id="loading-mask" class="loading-mask" hidden>
        <span class="loading-spinner" aria-hidden="true"></span>
        <span class="loading-label">正在加载</span>
      </div>
    </div>

    <section class="content">
      <div class="eyebrow">NOW PLAYING</div>
      <div id="title" class="title empty">等待点歌</div>
      <div id="artist" class="artist">播放器已就绪</div>
      <div id="meta" class="meta">等待新的歌曲进入队列</div>
      <div class="progress-row">
        <div class="progress-track"><div id="progress" class="progress-value"></div></div>
        <div id="time" class="time">00:00 / 00:00</div>
      </div>

      <div class="queue-block">
        <div class="queue-heading"><span>接下来播放</span><span id="queue-count">0 首</span></div>
        <div id="queue-list" class="queue-list"><div class="queue-empty">队列为空</div></div>
      </div>
    </section>

    <div id="device" class="device">
      <span class="role-dot" aria-hidden="true"></span>
      <span id="role-label" class="role-label">正在连接</span>
      <button id="claim" class="claim" type="button" hidden>设为主播放器</button>
    </div>

    <div class="controls" aria-label="播放控制">
      <button id="previous" class="control-button" type="button" title="上一首" aria-label="上一首">⏮</button>
      <button id="toggle" class="control-button primary" type="button" title="暂停" aria-label="暂停">⏸</button>
      <button id="next" class="control-button" type="button" title="下一首" aria-label="下一首">⏭</button>
    </div>

    <div id="finished-mask" class="finished-mask" hidden>
      <strong id="finished-title" class="finished-title">已播放结束</strong>
      <span id="finished-detail" class="finished-detail">队列为空</span>
    </div>
  </main>

  <audio id="audio"></audio>
  <script>
    const wsPath = __WS_PATH__
    const layout = __LAYOUT__
    const audio = document.getElementById('audio')
    const cover = document.getElementById('cover')
    const coverFallback = document.getElementById('cover-fallback')
    const loadingMask = document.getElementById('loading-mask')
    const title = document.getElementById('title')
    const artist = document.getElementById('artist')
    const meta = document.getElementById('meta')
    const progress = document.getElementById('progress')
    const time = document.getElementById('time')
    const queueCount = document.getElementById('queue-count')
    const queueList = document.getElementById('queue-list')
    const roleLabel = document.getElementById('role-label')
    const claimButton = document.getElementById('claim')
    const previousButton = document.getElementById('previous')
    const toggleButton = document.getElementById('toggle')
    const nextButton = document.getElementById('next')
    const finishedMask = document.getElementById('finished-mask')
    const finishedTitle = document.getElementById('finished-title')
    const finishedDetail = document.getElementById('finished-detail')
    let socket
    let role = 'offline'
    let state = { current: null, lastFinished: null, queue: [], history: [], phase: 'idle', playing: false, paused: false, position: 0 }
    let activeItemId = ''
    let lastProgressSentAt = 0

    document.body.dataset.layout = layout

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
      const params = new URLSearchParams(location.search)
      const wsUrl = new URL(protocol + '//' + location.host + wsPath)
      if (params.get('token')) wsUrl.searchParams.set('token', params.get('token'))
      wsUrl.searchParams.set('mode', params.get('mode') === 'display' ? 'display' : 'player')
      socket = new WebSocket(wsUrl)
      socket.addEventListener('open', () => send({ type: 'ready' }))
      socket.addEventListener('message', event => {
        const message = JSON.parse(event.data)
        if (message.type === 'state') render(message.state)
        if (message.type === 'play') play(message.item)
        if (message.type === 'pause') pauseAudio()
        if (message.type === 'resume') resumeAudio(message.item)
        if (message.type === 'stop') stopAudio()
        if (message.type === 'volume') audio.volume = Math.max(0, Math.min(1, Number(message.volume || 0) / 100))
        if (message.type === 'role') setRole(message.role)
      })
      socket.addEventListener('close', () => {
        stopAudio()
        setRole('offline')
        setTimeout(connect, 2000)
      })
    }

    function send(message) {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message))
    }

    function play(item) {
      if (role !== 'player') return
      activeItemId = item.id
      audio.src = item.song.url
      audio.currentTime = 0
      audio.play().catch(reportPlayError)
    }

    function pauseAudio() {
      audio.pause()
    }

    function resumeAudio(item) {
      if (role !== 'player' || !item) return
      if (activeItemId !== item.id || !audio.getAttribute('src')) {
        activeItemId = item.id
        audio.src = item.song.url
      }
      audio.play().catch(reportPlayError)
    }

    function stopAudio() {
      audio.pause()
      activeItemId = ''
      audio.removeAttribute('src')
      audio.load()
    }

    function reportPlayError(error) {
      send({ type: 'error', message: String(error && error.message || error) })
    }

    function setRole(nextRole) {
      role = nextRole
      document.body.dataset.role = role
      roleLabel.textContent = role === 'player' ? '主播放器' : role === 'vlc' ? 'VLC 播放后端' : role === 'display' ? '展示端' : '连接已断开'
      claimButton.hidden = role !== 'display'
      if (role !== 'player') stopAudio()
      updateControls()
    }

    function render(nextState) {
      state = nextState || state
      const current = state.current
      const displayed = current || state.lastFinished && state.lastFinished.item
      if (!displayed) {
        title.textContent = '等待点歌'
        title.classList.add('empty')
        artist.textContent = '播放器已就绪'
        meta.textContent = '等待新的歌曲进入队列'
        cover.hidden = true
        coverFallback.hidden = false
      } else {
        title.textContent = displayed.song.title
        title.classList.remove('empty')
        artist.textContent = displayed.song.artist
        meta.textContent = sourceLabel(displayed.song.source) + ' · 点歌：' + displayed.requester.name
        if (displayed.song.cover) {
          cover.src = displayed.song.cover
          cover.hidden = false
          coverFallback.hidden = true
        } else {
          cover.hidden = true
          coverFallback.hidden = false
        }
      }

      const finished = !current && state.lastFinished
      loadingMask.hidden = !(current && state.phase === 'loading')
      finishedMask.hidden = !finished
      if (finished) {
        finishedMask.className = 'finished-mask ' + state.lastFinished.reason
        finishedTitle.textContent = finishTitle(state.lastFinished.reason)
        finishedDetail.textContent = state.queue && state.queue.length
          ? '等待队列 ' + state.queue.length + ' 首'
          : '队列为空'
      }

      const queue = state.queue || []
      queueCount.textContent = queue.length + ' 首'
      queueList.replaceChildren()
      if (!queue.length) {
        const empty = document.createElement('div')
        empty.className = 'queue-empty'
        empty.textContent = '队列为空'
        queueList.appendChild(empty)
      } else {
        queue.slice(0, layout === 'sidebar' ? 5 : 2).forEach((item, index) => {
          const row = document.createElement('div')
          row.className = 'queue-item'
          const number = document.createElement('span')
          number.className = 'queue-index'
          number.textContent = String(index + 1).padStart(2, '0')
          const song = document.createElement('span')
          song.className = 'queue-song'
          song.textContent = item.song.title + ' · ' + item.song.artist
          row.append(number, song)
          queueList.appendChild(row)
        })
      }
      renderProgress(current ? state.position || 0 : state.lastFinished && state.lastFinished.position || 0)
      updateControls()
    }

    function updateControls() {
      const canControl = role === 'player' || role === 'vlc'
      previousButton.disabled = !canControl || !(state.history && state.history.length)
      toggleButton.disabled = !canControl || !state.current || state.phase === 'loading'
      nextButton.disabled = !canControl || !state.current
      toggleButton.textContent = state.paused ? '▶' : '⏸'
      toggleButton.title = state.paused ? '继续播放' : '暂停'
      toggleButton.setAttribute('aria-label', toggleButton.title)
    }

    function renderProgress(position) {
      const displayed = state.current || state.lastFinished && state.lastFinished.item
      const duration = displayed && displayed.song.duration || 0
      const percent = duration ? Math.min(100, Math.max(0, position / duration * 100)) : 0
      progress.style.width = percent + '%'
      time.textContent = formatTime(position) + ' / ' + formatTime(duration)
    }

    function formatTime(value) {
      const total = Math.max(0, Math.floor(Number(value || 0) / 1000))
      return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0')
    }

    function sourceLabel(source) {
      return ({ netease: '网易云', tencent: 'QQ 音乐', kugou: '酷狗' })[source] || source
    }

    function finishTitle(reason) {
      return ({ ended: '已播放结束', skipped: '已跳过', error: '播放失败' })[reason] || '播放已结束'
    }

    claimButton.addEventListener('click', () => send({ type: 'claim' }))
    previousButton.addEventListener('click', () => send({ type: 'previous' }))
    toggleButton.addEventListener('click', () => send({ type: state.paused ? 'resume' : 'pause' }))
    nextButton.addEventListener('click', () => send({ type: 'next' }))
    ;['loadstart', 'waiting', 'stalled'].forEach(eventName => {
      audio.addEventListener(eventName, () => {
        if (role === 'player' && activeItemId) send({ type: 'loading', itemId: activeItemId })
      })
    })
    audio.addEventListener('playing', () => {
      if (role === 'player' && activeItemId) send({ type: 'playing', itemId: activeItemId })
    })
    audio.addEventListener('timeupdate', () => {
      if (role !== 'player' || !activeItemId) return
      const position = Math.round(audio.currentTime * 1000)
      renderProgress(position)
      if (Date.now() - lastProgressSentAt >= 1000) {
        lastProgressSentAt = Date.now()
        send({ type: 'progress', itemId: activeItemId, position })
      }
    })
    audio.addEventListener('ended', () => {
      if (role === 'player') send({ type: 'ended' })
    })
    audio.addEventListener('error', () => {
      if (role !== 'player') return
      const mediaError = audio.error
      const details = mediaError
        ? 'code=' + mediaError.code + (mediaError.message ? ', ' + mediaError.message : '')
        : 'unknown media error'
      send({ type: 'error', message: details + ', networkState=' + audio.networkState + ', readyState=' + audio.readyState })
    })
    cover.addEventListener('error', () => {
      cover.hidden = true
      coverFallback.hidden = false
    })
    connect()
  </script>
</body>
</html>
